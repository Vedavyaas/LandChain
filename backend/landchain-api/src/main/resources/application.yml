server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:landchaindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true          # browse http://localhost:8080/h2-console
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop  # auto-creates tables on start, drops on stop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

landchain:
  jwt:
    secret: "3f2a1b8c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a"
    expiration-ms: 86400000   # 24 hours
  storage:
    upload-dir: "storage/documents"

logging:
  level:
    com.landchain: DEBUG
    org.springframework.security: INFO
