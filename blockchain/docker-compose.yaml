version: '3.7'

networks:
  landchain-net:
    name: landchain-net

services:
  orderer.landchain.local:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.landchain.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - "7050:7050"
    networks:
      - landchain-net

  peer0.org1.landchain.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1.landchain.local
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=landchain-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_ID=peer0.org1.landchain.local
      - CORE_PEER_ADDRESS=peer0.org1.landchain.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.landchain.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.landchain.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.landchain.local:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_GATEWAY_ENABLED=true
      - CORE_GATEWAY_ENDORSINGREQUESTTIMEOUT=15s
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "7051:7051"
    volumes:
      - /var/run/:/host/var/run/
    networks:
      - landchain-net
